---
efiBootLoader: "grub"
# The firmware entry is named for the product, not for the Ubuntu base: the
# installed system's boot menu and efibootmgr entry must read AURELIA.
efiBootloaderId: "aurelia"
installEFIFallback: true
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
