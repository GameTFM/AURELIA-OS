---
# AURELIA OS user creation.
#
# doAutologin is deliberately false. AURELIA's first-boot login is provided by
# aurelia-firstboot.service, which writes an SDDM drop-in only until the OOBE
# completes; an installed system must otherwise ask for its password. Enabling
# Calamares autologin logged every installation straight into the desktop.
#
# No loginName preset is set: the live image already contains the `aurelia`
# account, and presetting the same name made useradd fail on the target. The
# target cleanup removes the live account before this module runs, and the user
# chooses their own login name here.
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - audio
    - name: sudo
      must_exist: true
      system: true

sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
doAutologin: false

passwordRequirements:
    minLength: 8
    maxLength: 64
    libpwquality:
        - minlen=8
        - maxrepeat=4
        - maxsequence=4

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "aurelia"
    forbidden_names: [ localhost ]

presets:
    fullName:
        value: "AURELIA User"
        editable: true
