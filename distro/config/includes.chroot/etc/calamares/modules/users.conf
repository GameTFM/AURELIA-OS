---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - audio
    - name: sudo
      must_exist: true
      system: true

sudoersGroup: sudo
autologinGroup: autologin
setRootPassword: false
doReusePassword: false
doAutologin: false

passwordRequirements:
    minLength: 8
    maxLength: 64
    libpwquality:
        - minlen=8
        - maxrepeat=4
        - maxsequence=4

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "aurelia"
    forbidden_names: [ localhost ]

presets:
    fullName:
        value: "AURELIA User"
        editable: true
    loginName:
        value: "aurelia"
        editable: true
