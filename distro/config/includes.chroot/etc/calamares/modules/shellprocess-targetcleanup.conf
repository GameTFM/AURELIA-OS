---
# Runs inside the target before the users module.
#
# The installed system must not keep the live session's account, its
# passwordless sudoers entry, its autologin drop-ins or the casper/live-boot
# packages. Without this the target kept a NOPASSWD root account named
# `aurelia`, SDDM could autologin as that account, and the chosen user could not
# be created with the presets this project previously shipped.
dontChroot: false
timeout: 300
script:
  - "rm -f /etc/sddm.conf.d/zz-aurelia-live.conf /etc/sddm.conf.d/zzzz-aurelia-live.conf /etc/casper.conf"
  - "rm -f /usr/share/applications/install-aurelia.desktop /etc/sudoers.d/90-aurelia-live"
  - "rm -f /var/lib/aurelia/oobe-complete /var/lib/aurelia/first-run-complete"
  - "rm -f /home/aurelia/.config/aurelia-setup-complete"
  - "if id aurelia >/dev/null 2>&1; then userdel -r aurelia >/dev/null 2>&1 || true; fi"
  - "if dpkg -s casper >/dev/null 2>&1; then DEBIAN_FRONTEND=noninteractive apt-get purge -y casper live-boot live-boot-initramfs-tools live-config live-config-systemd || true; fi"
  - "DEBIAN_FRONTEND=noninteractive apt-get autoremove -y || true"
