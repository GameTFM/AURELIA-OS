---
# AURELIA OS Calamares configuration.
modules-search: [ local ]

instances:
  - id: aurelia-livecleanup
    module: shellprocess
    config: shellprocess-livecleanup.conf
  - id: aurelia-targetcleanup
    module: shellprocess
    config: shellprocess-targetcleanup.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfsc
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      # Target cleanup must precede users: it removes the live account and its
      # autologin/sudoers files, so the chosen account can be created cleanly.
      - shellprocess@aurelia-targetcleanup
      - initramfs
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - shellprocess@aurelia-livecleanup
      # grubcfg writes /etc/default/grub in the target (distributor, timeout,
      # recovery entries) before bootloader installs and generates grub.cfg.
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: aurelia
prompt-install: false
hide-back-and-next-during-exec: false
quit-at-end: false
dont-chroot: false
oem-setup: false
