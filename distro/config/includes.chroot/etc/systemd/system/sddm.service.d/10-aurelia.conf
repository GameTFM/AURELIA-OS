[Unit]
# sddm.service ships After=plymouth-quit-wait.service. That helper runs
# /usr/bin/plymouth --wait with TimeoutSec=0, so when plymouthd does not exit
# the ordering dependency never completes and the display manager start job is
# dropped without ever writing a journal entry (observed on the live ISO:
# graphical.target active, sddm inactive (dead), no jobs, "No entries").
# Keep ordering against the plymouth quit *request* so the splash has released
# the VT, but never block SDDM on the splash daemon finishing.
After=
After=systemd-user-sessions.service plymouth-start.service plymouth-quit.service systemd-logind.service
# sddm.service also ships Conflicts=plymouth-quit-wait.service. That unit is
# always part of a live-image boot transaction, and when a start job conflicts
# with a unit already queued, systemd drops the start job without logging it at
# the default level: graphical.target ends up active, sddm inactive (dead), no
# failed units and no journal entry. Clear the inherited conflicts and keep only
# the VT conflict, which is moot because getty@tty1 is masked.
Conflicts=
Conflicts=getty@tty1.service
