# AURELIA: NetworkManager manages wired devices directly.
#
# Ubuntu ships this file with
#     unmanaged-devices=*,except:type:wifi,except:type:gsm,except:type:cdma
# because netplan owns Ethernet on Ubuntu Server and cloud images. AURELIA does
# not ship netplan, and /etc/network/interfaces is empty, so that policy left
# every wired interface unmanaged: the live session measured `ens3` DOWN with no
# address and `getent hosts example.com` failing. An empty list marks no device
# unmanaged, so NetworkManager creates its default wired profile and runs DHCP.
[keyfile]
unmanaged-devices=
