# AURELIA OS 1.0.0 "Solstice" - Limine boot configuration
# The bootloader reads this file from the boot volume.

timeout: 0
quiet: yes
serial: yes
serial_baudrate: 115200
graphics: yes
interface_branding: AURELIA OS
interface_branding_colour: d6b878
interface_resolution: 1920x1080
term_palette: 090a0e;8c3b3b;4f7a5c;8a7240;3d4a6b;6b4a6b;3f6f74;d9d4c7
term_palette_bright: 3a3b42;c96b6b;7fae8c;d6b878;7390bd;a886b8;7fc4c9;f4f0e7

/AURELIA OS 1.0.0 (Solstice)
    protocol: limine
    path: boot():/aurelia.elf
    resolution: 1920x1080x32
    kaslr: no

# Recovery entry: boots the same kernel with recovery flags.
/AURELIA OS 1.0.0 (Recovery)
    protocol: limine
    path: boot():/aurelia.elf
    resolution: 1920x1080x32
    cmdline: recover=1
    kaslr: no
